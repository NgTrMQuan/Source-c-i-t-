<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ cài đặt Autodesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f4; --bg-2:#d9d9dc; --ink:#151517; --ink-2:#55555c; --ink-3:#8b8b93;
  --glass:rgba(255,255,255,.62); --glass-line:rgba(255,255,255,.75);
  --tray:#f4f4f6; --tray-edge:#c9c9ce;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* window-light streaks */
.light{position:fixed;inset:-20vh -20vw;pointer-events:none;z-index:0;
  background:
    radial-gradient(60vw 40vh at 78% 18%,rgba(255,255,255,.75),transparent 70%),
    repeating-linear-gradient(118deg,transparent 0 9vw,rgba(255,255,255,.28) 9vw 12vw,transparent 12vw 21vw),
    radial-gradient(50vw 50vh at 20% 90%,rgba(190,170,210,.22),transparent 70%);
  filter:blur(18px);transform:translateY(calc(var(--sy,0) * -0.08px))}
.wrap{position:relative;z-index:1}

/* nav */
nav.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:28px;padding:18px clamp(18px,4vw,48px);
  background:linear-gradient(var(--bg) 40%,rgba(238,240,244,0));}
.brand{font-weight:800;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 210deg,#ff6b8b,#a678ff,#4fa3ff,#2fe0b5,#ffc04a,#ff6b8b);animation:spin 8s linear infinite;box-shadow:inset 0 0 0 4px rgba(255,255,255,.55)}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-2);letter-spacing:0;line-height:1.25;max-width:150px}
.navlinks{display:flex;gap:22px;margin-left:auto;font-size:13px;font-weight:600}
.navlinks a{color:var(--ink-2)}
.navlinks a:hover{color:var(--ink)}
.who{font-size:12.5px;font-weight:600;border:1px solid var(--ink);border-radius:999px;padding:7px 14px;white-space:nowrap}

/* hero */
.hero{padding:clamp(28px,6vh,70px) clamp(18px,4vw,48px) 10px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:end;max-width:1360px;margin:0 auto}
.meta{font-size:12.5px;color:var(--ink-2);font-weight:600;margin:0 0 18px;display:flex;gap:14px;align-items:center}
.meta b{color:var(--ink)}
.meta span+span::before{content:"";display:inline-block;width:18px;height:1px;background:var(--ink-3);vertical-align:middle;margin-right:14px}
h1{font-size:clamp(40px,6.4vw,92px);line-height:1.02;font-weight:800;letter-spacing:-.035em;margin:0;text-transform:uppercase}
.lede{max-width:44ch;color:var(--ink-2);font-size:16px;margin:0 0 22px}
.search{display:flex;align-items:center;gap:10px;height:52px;border-radius:999px;padding:0 8px 0 20px;
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:0 10px 30px -14px rgba(20,20,30,.35),inset 0 1px 0 #fff;backdrop-filter:blur(14px)}
.search svg{flex:none;color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:500 15px var(--font);color:var(--ink);outline:none}
.search input::placeholder{color:var(--ink-3)}
.search .go{height:38px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 10px;border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);color:var(--ink-2);transition:background .15s,color .15s}
.chip i{width:14px;height:14px;border-radius:5px;background:var(--g)}
.chip:hover{background:#fff;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* stage: sticky 3D tray that flattens into the grid on scroll */
.stage{position:relative;height:210vh}
.stage.flat{height:auto}
.sticky{position:sticky;top:64px;height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;perspective:1800px;overflow:visible}
.stage.flat .sticky{position:relative;top:0;height:auto;padding:30px 0 60px}
.tray{position:relative;width:min(1180px,92vw);padding:26px;border-radius:30px;transform-style:preserve-3d;
  background:linear-gradient(160deg,#fbfbfc,var(--tray) 55%,#e9e9ec);
  box-shadow:
    0 1px 0 #fff inset,
    0 0 0 1px rgba(255,255,255,.9),
    0 2px 0 6px var(--tray-edge),
    0 60px 90px -40px rgba(30,30,45,.55),
    0 30px 40px -30px rgba(30,30,45,.4);
  will-change:transform}
.tray::before{content:"";position:absolute;inset:10px;border-radius:22px;border:1px dashed rgba(0,0,0,.08);pointer-events:none}
.trayhead{display:flex;justify-content:space-between;align-items:center;margin:0 4px 18px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.trayhead .dots{display:flex;gap:6px}
.trayhead .dots i{width:9px;height:9px;border-radius:50%;background:#cfcfd4}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;transform-style:preserve-3d}

.card{position:relative;aspect-ratio:1/.92;border-radius:18px;padding:14px 14px 12px;text-align:left;color:#fff;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 -10px 20px -12px rgba(0,0,0,.35) inset,0 14px 22px -12px rgba(20,20,40,.55),0 3px 0 0 color-mix(in srgb,var(--c2) 70%,#000);
  transform:translateZ(calc(var(--lift,0) * 1px));transition:transform .22s cubic-bezier(.3,.7,.2,1),opacity .2s,filter .2s,box-shadow .22s}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.32),transparent 38%,transparent 70%,rgba(255,255,255,.08));pointer-events:none}
.card:hover,.card:focus-visible{--lift:28;outline:0;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 26px 34px -14px rgba(20,20,40,.6),0 3px 0 0 color-mix(in srgb,var(--c2) 70%,#000)}
.stage.flat .card:hover,.stage.flat .card:focus-visible{transform:translateY(-6px)}
.card.dim{opacity:.18;filter:grayscale(.8)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .code{font-weight:800;font-size:clamp(15px,1.5vw,20px);letter-spacing:-.01em;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:3px 8px;line-height:1.2}
.card .n{font-size:11.5px;font-weight:600;opacity:.85;white-space:nowrap}
.card .name{display:block;font-weight:700;font-size:clamp(13px,1.15vw,15.5px);line-height:1.2;margin-bottom:6px}
.card .yrs{font-size:11.5px;font-weight:600;opacity:.88;display:flex;align-items:center;gap:6px}
.card .yrs b{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28);position:relative;overflow:hidden}
.card .yrs b::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--span);background:#fff;border-radius:2px}
.card .warn{position:absolute;right:10px;bottom:34px;width:9px;height:9px;border-radius:50%;background:#ffd84a;box-shadow:0 0 0 3px rgba(255,216,74,.3)}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px;transition:opacity .3s}
.hint svg{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(4px)}}
.empty{grid-column:1/-1;padding:50px 0;text-align:center;color:var(--ink-2);font-weight:600}

footer{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:40px clamp(18px,4vw,48px) 50px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink-2)}

/* detail sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(40,40,50,.25);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:31;top:16px;right:16px;bottom:16px;width:min(720px,calc(100% - 32px));border-radius:26px;overflow:hidden;
  background:rgba(246,246,248,.86);backdrop-filter:blur(24px) saturate(1.2);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 40px 80px -30px rgba(20,20,40,.55);display:flex;flex-direction:column;
  transform:translateX(calc(100% + 30px)) rotateY(-8deg);transform-origin:right center;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.shead{position:relative;padding:22px 24px 20px;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2));display:flex;gap:16px;align-items:center}
.shead::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 45%);pointer-events:none}
.shead .code{font-weight:800;font-size:26px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:10px 14px;line-height:1}
.shead small{display:block;font-size:12.5px;font-weight:600;opacity:.85}
.shead h3{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.shead .x{margin-left:auto;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;position:relative;z-index:1}
.shead .x:hover{background:rgba(255,255,255,.38)}
.vers{display:flex;gap:8px;overflow-x:auto;padding:16px 24px 6px;scrollbar-width:thin}
.ver{flex:none;height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;background:#fff;border:1px solid #e1e1e5;color:var(--ink-2)}
.ver small{font-weight:500;color:var(--ink-3);margin-left:6px;font-size:12px}
.ver:hover{color:var(--ink)}
.ver[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ver[aria-selected="true"] small{color:#c9c9d0}
.files{flex:1;overflow:auto;padding:12px 24px 26px}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.fhead h4{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.fhead p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.note{border-radius:14px;padding:11px 14px;margin-bottom:14px;background:#fff6d6;color:#6b4d00;font-size:14px;font-weight:500}
.file{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid #e6e6ea;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 8px 18px -14px rgba(20,20,40,.35)}
.file .pt{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(150deg,var(--c1),var(--c2))}
.file .info{flex:1;min-width:0}
.file .lab{font-size:12px;font-weight:600;color:var(--ink-3)}
.file .fn{font-weight:700;font-size:14.5px;word-break:break-all;line-height:1.3}
.file .u{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.file .acts{display:flex;gap:8px;flex:none}
.btn{height:40px;padding:0 16px;border-radius:999px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn.dl{background:var(--ink);color:#fff}
.btn.dl:hover{background:#2c2c31}
.btn.cp{background:#f0f0f3;color:var(--ink)}
.btn.cp:hover{background:#e4e4e9}
.btn.ok{background:#e3f4ea;color:#1c6b40}
.tip{font-size:13.5px;color:var(--ink-2);margin:14px 2px 0;max-width:62ch}
.toast{position:fixed;left:50%;bottom:28px;z-index:40;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:all .2s;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1000px){
  .hero{grid-template-columns:1fr;gap:22px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .navlinks{display:none}
}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tray{padding:14px;border-radius:22px}
  .who{display:none}
  .file{flex-wrap:wrap}
  .file .acts{width:100%}
  .file .acts .btn{flex:1;justify-content:center}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;height:88vh;border-radius:24px 24px 0 0;transform:translateY(100%)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- live concept ---- */
@keyframes spin{to{transform:rotate(1turn)}}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.38;mix-blend-mode:multiply;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:#ff6b8b;left:-10vmax;top:-12vmax}
.blobs i:nth-child(2){background:#4fa3ff;right:-14vmax;top:10vh;animation-duration:26s;animation-delay:-6s}
.blobs i:nth-child(3){background:#2fe0b5;left:20vw;bottom:-22vmax;animation-duration:30s;animation-delay:-12s}
.blobs i:nth-child(4){background:#ffc04a;right:10vw;bottom:-18vmax;opacity:.28;animation-duration:24s;animation-delay:-3s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vw,6vh) scale(1.15)}100%{transform:translate(-6vw,10vh) scale(.92)}}
.title span{display:block;overflow:hidden;padding:.2em 0 .06em;margin-top:-.12em}
.title i{display:block;font-style:normal;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.title span:nth-child(2) i{animation-delay:.12s;background:linear-gradient(90deg,#e0245e,#a678ff,#2754e6,#0a9a82,#f2661b,#e0245e);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s .12s cubic-bezier(.2,.8,.2,1) both,flow 9s linear infinite}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes flow{to{background-position:300% 0}}
.meta,.lede,.search,.legend{animation:fadeup .8s .35s cubic-bezier(.2,.8,.2,1) both}
.lede{animation-delay:.45s}.search{animation-delay:.55s}.legend{animation-delay:.65s}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{animation:deal .9s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:calc(.5s + var(--i) * 45ms)}
@keyframes deal{from{opacity:0;translate:0 -90px;scale:.7}to{opacity:1;translate:0 0;scale:1}}
.card .float{position:absolute;inset:0;pointer-events:none}
.stage:not(.flat) .card.ready{animation:bob 4.8s ease-in-out infinite;animation-delay:calc(var(--i) * -310ms)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
.card::before{content:"";position:absolute;top:0;bottom:0;width:45%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:shine 7s ease-in-out infinite;animation-delay:calc(var(--i) * 290ms);pointer-events:none;z-index:1}
@keyframes shine{0%,72%{left:-60%}88%,100%{left:130%}}
.ic{position:relative;width:50px;height:50px;border-radius:14px;flex:none;display:grid;place-items:center;overflow:hidden;
  background:rgba(255,255,255,.95);box-shadow:0 6px 14px -6px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.6)}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;background:#fff;z-index:1}
.ic:has(img){background:transparent;box-shadow:none;overflow:visible}
.ic:has(img) img{padding:0;background:transparent;filter:drop-shadow(0 6px 8px rgba(0,0,0,.28))}
.ic:has(img) b{display:none}
.ic b{font-weight:800;font-size:17px;letter-spacing:-.02em;background:linear-gradient(150deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sicon .ic{width:58px;height:58px;border-radius:17px}
.sicon .ic b{font-size:22px}
.card .name{font-size:clamp(14.5px,1.35vw,18px)!important;font-weight:800!important;letter-spacing:-.01em;line-height:1.18!important;text-shadow:0 1px 8px rgba(0,0,0,.18)}
.spark{position:fixed;z-index:50;pointer-events:none;width:8px;height:8px;border-radius:50%;animation:pop .7s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
@media (prefers-reduced-motion:reduce){.blobs i,.card,.card::before,.title i{animation:none!important}}
/* ---- one-screen layout ---- */
html,body{height:100%}
.wrap{height:100vh;display:flex;flex-direction:column}
nav.top{position:relative;flex:none;padding:14px clamp(18px,3vw,40px)}
main.one{flex:1;min-height:0;display:grid;grid-template-columns:minmax(290px,370px) minmax(0,1fr);gap:clamp(20px,3vw,44px);padding:0 clamp(18px,3vw,40px) clamp(16px,2.4vh,28px);max-width:1600px;width:100%;margin:0 auto}
.hero{display:flex;flex-direction:column;justify-content:center;padding:0;gap:0;max-width:none;margin:0}
.hero h1{font-size:clamp(34px,3.7vw,62px);margin-bottom:18px}
.meta{margin-bottom:12px;flex-wrap:wrap}
.lede{font-size:15px;margin-bottom:16px}
.legend{margin-top:14px}
.stage,.stage.flat{height:auto;min-height:0;display:flex}
.sticky,.stage.flat .sticky{position:relative;top:0;height:100%;width:100%;padding:0;display:flex;align-items:stretch;justify-content:center}
.tray{width:100%;height:100%;display:flex;flex-direction:column;padding:18px;border-radius:26px}
.trayhead{margin:0 4px 12px}
.grid{flex:1;min-height:0;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:12px}
.card{aspect-ratio:auto;min-height:0;padding:12px 12px 10px}
.card .name{font-size:clamp(13px,1.1vw,16.5px)!important}
.ic{width:clamp(34px,3vw,46px);height:clamp(34px,3vw,46px)}
@media (max-width:1000px){
  .wrap{height:auto}
  main.one{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:none}
  .card{aspect-ratio:1/.95}
}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="light" aria-hidden="true"></div>
<div class="wrap">
  <nav class="top">
    <div class="brand"><i></i><div>Bộ cài đặt Autodesk<small>Thư viện bộ cài Autodesk của nhóm</small></div></div>
    <div class="navlinks" id="navlinks"></div>
    <div class="who">Người cập nhật: Minh Quân</div>
  </nav>

  <main class="one">
  <header class="hero">
    <div>
      <p class="meta"><span>Cập nhật <b>16.11.2026</b></span><span><b id="sP"></b> phần mềm</span><span><b id="sL"></b> file</span></p>
      <h1 class="title"><span><i>Bộ cài đặt</i></span><span><i>Autodesk</i></span></h1>
      <p class="lede">Chọn một thẻ để xem các phiên bản từ 2015 đến 2027, rồi tải về hoặc sao chép link.</p>
      <label class="search">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Tìm phần mềm hoặc năm…" autocomplete="off" aria-label="Tìm phần mềm">
        <button class="go" id="go" type="button">Tìm</button>
      </label>
      <div class="legend" id="legend" role="group" aria-label="Lọc theo nhóm"></div>
    </div>
  </header>

  <section class="stage" id="stage">
    <div class="sticky">
      <div class="tray" id="tray">
        <div class="trayhead"><span id="trayTitle">Tất cả phần mềm</span><span class="dots"><i></i><i></i><i></i></span></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle" aria-hidden="true">
  <div class="shead">
    <div class="sicon" id="sCode"></div>
    <div><small id="sGroup"></small><h3 id="sTitle"></h3></div>
    <button class="x" id="sClose" aria-label="Đóng"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="vers" id="vers" role="tablist" aria-label="Phiên bản"></div>
  <div class="files" id="files"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
let DATA = null;
const CODES = {"AutoCAD":"ACD","AutoCAD LT":"LT","AutoCAD Architecture":"ARCH","AutoCAD Electrical":"ELEC","AutoCAD Mechanical":"MECH","AutoCAD Plant 3D":"PLNT","DWG TrueView":"DWG","Revit":"RVT","Revit LT":"RVT LT","Revit Update":"UPD","Navisworks Manage":"NAVM","Navisworks Simulate":"NAVS","Recap Pro":"RCP","Civil 3D":"C3D","InfraWorks":"IW","Advance Steel":"ASTL","Inventor":"INV","PowerMill":"PMILL","PowerShape":"PSHP","Vault Professional Client":"VPC","Vault Professional Server":"VPS","Vault Basic Client":"VBC","3ds Max":"3DS","Maya":"MAYA"};
const COLORS = {
  "AutoCAD":["#ff6b8b","#e0245e"],
  "Revit & BIM":["#4fa3ff","#2754e6"],
  "Hạ tầng & Kết cấu":["#2fe0b5","#0a9a82"],
  "Cơ khí & Gia công":["#ffc04a","#f2661b"],
  "Vault":["#a678ff","#5a37e0"],
  "Đồ họa 3D":["#ff6be0","#b52bc0"]
};
const initials = n => n.replace(/^AutoCAD /,'').replace(/^Vault /,'V ').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
function iconHTML(p){
  const src = p.img || `icons/${p.id}.png`;
  return `<span class="ic"><img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()"><b>${esc(initials(p.name))}</b></span>`;
}
const col = g => COLORS[g] || ["#9a9aa3","#5f5f68"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const slug = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fileName = u => { try { const x = new URL(u); const m = /filename\s*=\s*"([^"]+)"/.exec(decodeURIComponent(x.search)); return m ? m[1] : decodeURIComponent(x.pathname.split('/').pop()); } catch(e){ return u; } };
const years = p => p.versions.map(v => +(v.v.match(/^\d{4}/)||[])[0]).filter(Boolean);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let groups = [], active = 'Tất cả', cur = null, back = null;

function start(){
  DATA.forEach(p => { p.id = slug(p.name); p.code = CODES[p.name] || p.name.slice(0,3).toUpperCase(); });
  groups = [...new Set(DATA.map(p => p.group))];
  $('sP').textContent = DATA.length;
  $('sL').textContent = DATA.reduce((a,p)=>a+p.versions.reduce((b,v)=>b+v.links.length,0),0);
  $('navlinks').innerHTML = groups.slice(0,4).map(g => `<a href="#" data-g="${esc(g)}">${esc(g)}</a>`).join('');
  renderLegend(); renderGrid(); route(); apply();
}

function renderLegend(){
  $('legend').innerHTML = ['Tất cả',...groups].map(g => {
    const [a,b] = col(g);
    return `<button class="chip" aria-pressed="${g===active}" data-g="${esc(g)}" style="--g:${g==='Tất cả'?'conic-gradient(#ff6b8b,#a678ff,#4fa3ff,#2fe0b5,#ffc04a,#ff6b8b)':`linear-gradient(150deg,${a},${b})`}"><i></i>${esc(g)}</button>`;
  }).join('');
}
function pickGroup(g){ active = g; renderLegend(); filter(); }
$('legend').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) pickGroup(b.dataset.g); });
$('navlinks').addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); pickGroup(a.dataset.g); });

function renderGrid(){
  const minY = 2015, maxY = 2027;
  $('grid').innerHTML = DATA.map((p,i) => {
    const [a,b] = col(p.group); const ys = years(p); const lo = Math.min(...ys), hi = Math.max(...ys);
    const span = Math.max(8, (hi - lo) / (maxY - minY) * 100);
    return `<button class="card" data-id="${p.id}" style="--c1:${a};--c2:${b};--i:${i}" aria-label="${esc(p.name)}, ${p.versions.length} phiên bản">
      <span class="top">${iconHTML(p)}<span class="n">${p.versions.length} bản</span></span>
      ${p.note ? '<i class="warn" title="Có link cần kiểm tra"></i>' : ''}
      <span><span class="name">${esc(p.name)}</span><span class="yrs">${lo}<b style="--span:${span}%"></b>${hi}</span></span>
    </button>`;
  }).join('');
  setTimeout(() => $('grid').querySelectorAll('.card').forEach(c => c.classList.add('ready')), 2200);
}
function filter(){
  const words = norm($('q').value).split(/[^a-z0-9]+/).filter(Boolean);
  let shown = 0;
  DATA.forEach(p => {
    const ok = (active === 'Tất cả' || p.group === active) && words.every(w => norm(p.name+' '+p.code+' '+p.group+' '+p.versions.map(v=>v.v).join(' ')).includes(w));
    $('grid').querySelector(`[data-id="${p.id}"]`).classList.toggle('dim', !ok);
    if (ok) shown++;
  });
  $('trayTitle').textContent = (active === 'Tất cả' ? 'Tất cả phần mềm' : active) + (words.length ? ` · ${shown} kết quả` : '');
}
$('q').addEventListener('input', filter);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') goFirst(); });
$('go').addEventListener('click', goFirst);
function goFirst(){
  filter();
  const first = $('grid').querySelector('.card:not(.dim)');
  if (!first) { toast('Không có phần mềm khớp'); return; }
  first.focus();
}
$('grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (!c) return; const r = c.getBoundingClientRect(); const p = DATA.find(x => x.id === c.dataset.id); const [a,b] = col(p.group); sparks(e.clientX || r.left + r.width/2, e.clientY || r.top + r.height/2, a, b); setTimeout(() => location.hash = c.dataset.id, 140); });

/* intro: tray lands from an isometric tilt to flat, then follows the pointer */
const ease = t => 1 - Math.pow(1 - t, 3);
let introP = reduced ? 1 : 0, mx = 0, my = 0, t0 = null;
function frame(ts){
  if (t0 === null) t0 = ts;
  introP = Math.max(0, Math.min(1, (ts - t0 - 250) / 1500));
  apply();
  if (introP < 1) requestAnimationFrame(frame);
}
function apply(){
  if (innerWidth < 1000){ $('tray').style.transform = 'none'; return; }
  const e = ease(introP);
  const rx = 52 * (1 - e) - my * 5 * e, ry = mx * 6 * e, rz = -30 * (1 - e), s = .82 + .18 * e;
  $('tray').style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
}
addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; if (!reduced && introP >= 1) requestAnimationFrame(apply); }, {passive:true});
addEventListener('resize', apply);
function sparks(x, y, c1, c2){
  if (reduced) return;
  for (let k = 0; k < 14; k++){
    const s = document.createElement('i'); s.className = 'spark';
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 60;
    s.style.cssText = `left:${x}px;top:${y}px;background:${k % 2 ? c1 : c2};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 720);
  }
}
requestAnimationFrame(frame);


/* detail sheet */
function open(p){
  cur = p; back = document.activeElement;
  const [a,b] = col(p.group);
  $('sheet').style.setProperty('--c1', a); $('sheet').style.setProperty('--c2', b);
  $('sCode').innerHTML = iconHTML(p); $('sGroup').textContent = p.group; $('sTitle').textContent = p.name;
  $('vers').innerHTML = p.versions.map((v,i) => `<button class="ver" role="tab" data-i="${i}" aria-selected="${i===0}">${esc(v.v)}<small>${v.links.length}</small></button>`).join('');
  show(0);
  $('sheet').classList.add('open'); $('scrim').classList.add('open'); $('sheet').setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  setTimeout(() => $('vers').querySelector('.ver')?.focus(), 80);
}
function show(i){
  const v = cur.versions[i], n = v.links.length; $('files').dataset.v = i;
  $('vers').querySelectorAll('.ver').forEach((b,j) => b.setAttribute('aria-selected', j===i));
  $('vers').querySelectorAll('.ver')[i]?.scrollIntoView({block:'nearest',inline:'nearest'});
  $('files').innerHTML =
    `<div class="fhead"><div><h4>${esc(cur.name)} ${esc(v.v)}</h4><p>${n === 1 ? '1 file cài đặt' : `${n} file, cần tải đủ cả ${n}`}</p></div>
      ${n > 1 ? `<button class="btn cp" data-all>Sao chép ${n} link</button>` : ''}</div>` +
    (cur.note ? `<div class="note">${esc(cur.note)}</div>` : '') +
    v.links.map((l,k) => `<div class="file">
      <span class="pt">${n > 1 ? k + 1 : '↓'}</span>
      <div class="info"><div class="lab">${esc(l.label)}</div><div class="fn">${esc(fileName(l.url))}</div><div class="u" title="${esc(l.url)}">${esc(l.url)}</div></div>
      <div class="acts"><a class="btn dl" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">Tải về</a><button class="btn cp" data-k="${k}">Sao chép</button></div>
    </div>`).join('') +
    (n > 1 ? `<p class="tip">Đặt cả ${n} file vào cùng một thư mục, giữ nguyên tên, rồi chạy Part 1. Trình cài đặt tự ghép các phần còn lại.</p>` : '');
  $('files').scrollTop = 0;
}
function close(){
  if (!cur) return; cur = null;
  $('sheet').classList.remove('open'); $('scrim').classList.remove('open'); $('sheet').setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  if (location.hash) history.replaceState(null,'',location.pathname+location.search);
  back?.focus?.({preventScroll:true});
}
$('vers').addEventListener('click', e => { const b = e.target.closest('.ver'); if (b) show(+b.dataset.i); });
$('vers').addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault(); const n = cur.versions.length, i = +$('files').dataset.v;
  const j = (i + (e.key === 'ArrowRight' ? 1 : -1) + n) % n; show(j); $('vers').querySelectorAll('.ver')[j].focus();
});
$('sClose').addEventListener('click', close);
$('scrim').addEventListener('click', close);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') close();
  if (e.key === '/' && !cur && document.activeElement !== $('q')){ e.preventDefault(); $('q').focus(); }
});

async function copy(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){ try { const a = document.createElement('textarea'); a.value = t; a.style.cssText='position:fixed;opacity:0'; document.body.appendChild(a); a.select(); const r = document.execCommand('copy'); a.remove(); return r; } catch(_){ return false; } }
}
let tt;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'),1700); }
$('files').addEventListener('click', async e => {
  const v = cur?.versions[+$('files').dataset.v]; if (!v) return;
  const one = e.target.closest('[data-k]'), all = e.target.closest('[data-all]');
  if (one){
    const r = await copy(v.links[+one.dataset.k].url);
    if (r){ one.classList.add('ok'); one.textContent = 'Đã chép'; setTimeout(()=>{ one.classList.remove('ok'); one.textContent = 'Sao chép'; },1500); }
    toast(r ? 'Đã sao chép link' : 'Trình duyệt chặn sao chép. Bôi đen link để copy.');
  } else if (all){
    const r = await copy(v.links.map(l => l.url).join('\n'));
    toast(r ? `Đã sao chép ${v.links.length} link` : 'Trình duyệt chặn sao chép. Bôi đen link để copy.');
  }
});

function route(){
  const p = DATA.find(x => x.id === location.hash.slice(1));
  if (p && p !== cur){ if (cur) close(); open(p); }
  else if (!p) close();
}
addEventListener('hashchange', route);

if (DATA) start();
else fetch('data.json',{cache:'no-store'}).then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => { DATA = d; start(); })
  .catch(() => { $('grid').innerHTML = '<div class="empty">Không tải được data.json. Kiểm tra file nằm cùng thư mục với index.html.</div>'; });
</script>
</body>
</html>
