name: Đồng bộ từ Notion

on:
  workflow_dispatch:   # chạy tay: tab Actions → "Đồng bộ từ Notion" → Run workflow

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lấy link mới từ Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python tools/notion_sync.py --write
      - name: Lưu thay đổi
        run: |
          git config user.name "notion-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "Không có gì mới." && exit 0
          git commit -m "Bổ sung link từ Notion"
          git push
